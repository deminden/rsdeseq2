[package]
name = "rsdeseq2"
version = "0.3.1"
edition = "2024"
license = "MIT"
rust-version = "1.97.1"

[lib]
name = "rsdeseq2"
path = "src/lib.rs"

[dependencies]
clap = { version = "^4.6.7", features = ["derive"] }
csv = { version = "^1.4.0" }
nalgebra = { version = "^0.35.0" }
rayon = { version = "^1.12.0" }
rcompat-lbfgsb = { version = "^0.2.2" }
rcompat-locfit = { version = "^0.1.5" }
same-file = { version = "^1.0" }
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = { version = "^1.0.154" }
sha2 = { version = "^0.10" }
statrs = { version = "^0.18.0" }
thiserror = { version = "^2.0.21" }
