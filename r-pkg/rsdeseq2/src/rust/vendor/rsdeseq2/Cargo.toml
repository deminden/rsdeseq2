[package]
name = "rsdeseq2"
version = "0.3.1"
edition = "2024"
license = "MIT"
rust-version = "1.97.1"

[lib]
name = "rsdeseq2"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
nalgebra = "0.35.0"
rayon = "1.12.0"
rcompat-lbfgsb = "0.2.2"
rcompat-locfit = "0.1.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
statrs = "0.18.0"
thiserror = "2.0.21"
