[package]
name = "rsdeseq2-r"
version = "0.6.1"
edition = "2024"
rust-version = "1.96.0"
publish = false
exclude = [".DS_Store", "**/.DS_Store"]

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
rcompat-numeric = { path = "vendor/rcompat-numeric" }
# The R package needs formula collation and the shrinkage engines, not the CLI.
rsdeseq2 = { path = "vendor/rsdeseq2", default-features = false, features = ["formula", "shrinkage"] }

[workspace]

[profile.release]
codegen-units = 1
lto = "thin"
# The R boundary catches Rust panics before returning to C.
panic = "unwind"
