# cargo-deny policy, checked in CI (`cargo deny check`).

[graph]
all-features = true

[licenses]
# Workspace and dependency licenses.
allow = [
    "Apache-2.0",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[advisories]
# Default policy: known vulnerabilities and yanked crates fail the check.
yanked = "deny"

[bans]
# Duplicate versions are reported but do not fail yet; wildcards do.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
