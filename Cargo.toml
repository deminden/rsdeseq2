[workspace]
members = ["crates/rsdeseq2"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/deminden/rsdeseq2"
rust-version = "1.97.1"

[workspace.dependencies]
approx = "0.5.1"
clap = { version = "4.6.7", features = ["derive"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
csv = "1.4.0"
icu_collator = "2.4.0"
icu_locale = "2.4.0"
libm = "0.2.16"
nalgebra = "0.35.0"
rayon = "1.12.0"
rcompat-locfit = "0.2.0"
rcompat-lbfgsb = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
same-file = "1.0.6"
statrs = "0.19.1"
thiserror = "2.0.21"
