[workspace]
members = [
    "crates/rcompat-collate",
    "crates/rcompat-formula",
    "crates/rcompat-numeric",
    "crates/rcompat-shrinkage",
    "crates/rsdeseq2",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/deminden/rsdeseq2"
rust-version = "1.96.0"

# Whole-program optimisation for the CLI and benchmarks. Floating-point
# semantics are unchanged (no fast-math); the golden harness checks outputs.
# Do not add `panic = "abort"`: the R bridge relies on unwinding.
[profile.release]
codegen-units = 1
lto = "thin"

# Local checks (golden harness, benchmarks of one's own changes) without the
# whole-program optimisation: rustc peaks at about 1.9 GB per heavy target
# with release LTO, so parallel release builds of every test target can use
# tens of GB on a laptop. Floating-point semantics are the same; the golden
# harness confirms identical output. `cargo run --profile local ...`
[profile.local]
inherits = "release"
codegen-units = 16
lto = false

# Library lint policy lives in crates/rsdeseq2/src/lib.rs: unwrap/expect are
# denied outside tests and unsafe code is denied. Every public item is documented, and missing_docs keeps it so.
[workspace.lints.rust]
missing_docs = "deny"

[workspace.dependencies]
rcompat-collate = { path = "crates/rcompat-collate", version = "0.1.0" }
rcompat-formula = { path = "crates/rcompat-formula", version = "0.2.0" }
rcompat-numeric = { path = "crates/rcompat-numeric", version = "0.2.0" }
rcompat-shrinkage = { path = "crates/rcompat-shrinkage", version = "0.2.0" }
approx = "0.5.1"
clap = { version = "4.6.7", features = ["derive"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
csv = "1.4.0"
csv-core = "0.1.13"
libm = "0.2.16"
proptest = { version = "1", default-features = false, features = ["std"] }
rayon = "1.12.0"
rcompat-locfit = "0.2.0"
rcompat-lbfgsb = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
same-file = "1.0.6"
statrs = "0.19.1"
thiserror = "2.0.21"
# 0.1.26 added the Unicode-3.0 licence; 0.1.25 is MIT OR Apache-2.0.
unicode-normalization = "=0.1.25"
