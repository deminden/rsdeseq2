[workspace]
members = ["crates/rsdeseq2", "crates/rsdeseq2-base"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT AND BSD-3-Clause AND BSD-2-Clause-Views"
repository = "https://github.com/deminden/rsdeseq2"
rust-version = "1.97.1"

# Whole-program optimisation for the CLI and benchmarks. Floating-point
# semantics are unchanged (no fast-math); the golden harness checks outputs.
# Do not add `panic = "abort"`: the R bridge relies on unwinding.
[profile.release]
codegen-units = 1
lto = "thin"

# Library lint policy lives in crates/rsdeseq2/src/lib.rs: unwrap/expect are
# denied outside tests and unsafe code is denied except for the documented x87
# kernels. missing_docs warns until the public API is fully documented.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.dependencies]
rsdeseq2-base = { path = "crates/rsdeseq2-base", version = "0.5.0" }
approx = "0.5.1"
clap = { version = "4.6.7", features = ["derive"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
csv = "1.4.0"
icu_collator = "2.4.0"
icu_locale = "2.4.0"
libm = "0.2.16"
nalgebra = "0.35.0"
proptest = { version = "1", default-features = false, features = ["std"] }
rayon = "1.12.0"
rcompat-locfit = "0.2.0"
rcompat-lbfgsb = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
same-file = "1.0.6"
statrs = "0.19.1"
thiserror = "2.0.21"
