[workspace]
members = ["crates/rsdeseq2"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT AND BSD-3-Clause AND BSD-2-Clause-Views"
repository = "https://github.com/deminden/rsdeseq2"
rust-version = "1.97.1"

# Hardening targets (docs/reports/hardening-progress.md). They warn while the
# existing sites are removed; the gating Clippy command allows them explicitly
# until Phase 2.4 turns them into errors.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "warn"

[workspace.lints.clippy]
expect_used = "warn"
panic = "warn"
undocumented_unsafe_blocks = "warn"
unreachable = "warn"
unwrap_used = "warn"

[workspace.dependencies]
approx = "0.5.1"
clap = { version = "4.6.7", features = ["derive"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
csv = "1.4.0"
icu_collator = "2.4.0"
icu_locale = "2.4.0"
libm = "0.2.16"
nalgebra = "0.35.0"
rayon = "1.12.0"
rcompat-locfit = "0.2.0"
rcompat-lbfgsb = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
same-file = "1.0.6"
statrs = "0.19.1"
thiserror = "2.0.21"
