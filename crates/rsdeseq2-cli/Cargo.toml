[package]
name = "rsdeseq2-cli"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line interface for rsdeseq2: DESeq2-compatible RNA-seq differential expression in Rust, with no R runtime"
documentation = "https://docs.rs/rsdeseq2"
keywords = ["rnaseq", "deseq2", "bioinformatics", "gene-expression", "cli"]
categories = ["science", "command-line-utilities"]
exclude = [".DS_Store", "**/.DS_Store"]

[lints]
workspace = true

[[bin]]
name = "rsdeseq2"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[dependencies]
rsdeseq2 = { workspace = true, features = ["cli"] }

[dev-dependencies]
csv.workspace = true
serde_json.workspace = true
sha2.workspace = true
