[package]
name = "rsdeseq2"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "DESeq2-compatible RNA-seq differential expression in Rust, with a standalone CLI and no R runtime"
documentation = "https://docs.rs/rsdeseq2"
keywords = ["rnaseq", "deseq2", "bioinformatics", "gene-expression", "statistics"]
categories = ["science", "command-line-utilities"]
readme = "README.md"
autoexamples = false
autotests = false
exclude = [".DS_Store", "**/.DS_Store"]

[lints]
workspace = true

[lib]
name = "rsdeseq2"
path = "src/lib.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["cli"]

[[bench]]
name = "deseq_pipeline_bench"
harness = false

[[bench]]
name = "glm_gene_bench"
harness = false

[[bench]]
name = "dispersion_bench"
harness = false

[features]
default = ["cli", "formula", "shrinkage"]
# Command-line interface: the `rsdeseq2` binary and `rsdeseq2::cli`.
cli = ["dep:clap", "dep:sha2", "dep:same-file"]
# Locale-aware (ICU) collation for formula factor levels and string
# comparisons. Without it, formula evaluation supports only "C" collation.
formula = ["rcompat-formula/icu"]
# Empirical-Bayes shrinkage engines (`rsdeseq2::shrinkage`: ashr- and
# apeglm-style posteriors). Normal (beta-prior) shrinkage is always available.
shrinkage = ["dep:rcompat-shrinkage"]

[dependencies]
clap = { workspace = true, optional = true }
csv.workspace = true
libm.workspace = true
nalgebra.workspace = true
rayon.workspace = true
rcompat-formula.workspace = true
rcompat-shrinkage = { workspace = true, optional = true }
rsdeseq2-base.workspace = true
rcompat-lbfgsb.workspace = true
rcompat-locfit.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
same-file = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
approx.workspace = true
criterion.workspace = true
proptest.workspace = true
sha2.workspace = true
statrs.workspace = true

[[example]]
name = "compare_map_dispersion_fixture"
path = "tools/validation/compare_map_dispersion_fixture.rs"

[[example]]
name = "compare_se_covariance_fixture"
path = "tools/validation/compare_se_covariance_fixture.rs"

[[example]]
name = "golden"
path = "tools/validation/golden.rs"
required-features = ["shrinkage"]

[[example]]
name = "evaluate_r_interface"
path = "tools/validation/evaluate_r_interface.rs"
required-features = ["formula", "shrinkage"]
