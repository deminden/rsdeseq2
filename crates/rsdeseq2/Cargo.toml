[package]
name = "rsdeseq2"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust implementation of DESeq2-compatible differential expression workflows"
readme = "README.md"
autoexamples = false
exclude = [".DS_Store", "**/.DS_Store"]

[lib]
name = "rsdeseq2"
path = "src/lib.rs"

[[bin]]
name = "rsdeseq2"
path = "src/main.rs"

[[bench]]
name = "deseq_pipeline_bench"
harness = false

[[bench]]
name = "glm_gene_bench"
harness = false

[[bench]]
name = "dispersion_bench"
harness = false

[dependencies]
clap.workspace = true
csv.workspace = true
icu_collator.workspace = true
icu_locale.workspace = true
libm.workspace = true
nalgebra.workspace = true
rayon.workspace = true
rcompat-lbfgsb.workspace = true
rcompat-locfit.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
same-file.workspace = true
statrs.workspace = true
thiserror.workspace = true

[dev-dependencies]
approx.workspace = true
criterion.workspace = true

[[example]]
name = "compare_map_dispersion_fixture"
path = "tools/validation/compare_map_dispersion_fixture.rs"

[[example]]
name = "compare_se_covariance_fixture"
path = "tools/validation/compare_se_covariance_fixture.rs"

[[example]]
name = "evaluate_r_interface"
path = "tools/validation/evaluate_r_interface.rs"
