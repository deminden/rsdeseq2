[package]
name = "rcompat-collate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Compare and sort strings in R's collation order (C locale and the Unicode root collation) in pure Rust"
readme = "README.md"
documentation = "https://docs.rs/rcompat-collate"
keywords = ["r", "collation", "sorting", "unicode", "locale"]
categories = ["text-processing", "internationalization"]
exclude = [".DS_Store", "**/.DS_Store"]

[lints]
workspace = true

[dependencies]
unicode-normalization.workspace = true

[dev-dependencies]
proptest.workspace = true
