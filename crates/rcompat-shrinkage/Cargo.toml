[package]
name = "rcompat-shrinkage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "R-compatible empirical-Bayes shrinkage in Rust: ashr-style mixture posteriors and apeglm-style heavy-tailed posteriors, reproducing R"
documentation = "https://docs.rs/rcompat-shrinkage"
keywords = ["r", "ashr", "apeglm", "shrinkage", "statistics"]
categories = ["science", "mathematics"]
exclude = [".DS_Store", "**/.DS_Store"]

[lints]
workspace = true

[dependencies]
libm.workspace = true
nalgebra.workspace = true
rcompat-lbfgsb.workspace = true
rcompat-numeric.workspace = true
rcompat-formula.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
