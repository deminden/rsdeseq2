[package]
name = "rcompat-formula"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Build R-style model matrices in Rust from formulas, factor contrasts, interactions, numeric transforms, and offsets"
readme = "README.md"
documentation = "https://docs.rs/rcompat-formula"
keywords = ["r", "formula", "model-matrix", "statistics", "design-matrix"]
categories = ["science", "mathematics"]
exclude = [".DS_Store", "**/.DS_Store"]

[lints]
workspace = true

[features]
# Locale-aware (ICU) collation for factor levels and string comparisons.
icu = ["dep:icu_collator", "dep:icu_locale"]

[dependencies]
icu_collator = { workspace = true, optional = true }
icu_locale = { workspace = true, optional = true }
rcompat-numeric.workspace = true
rustc_apfloat = "0.2.3"
