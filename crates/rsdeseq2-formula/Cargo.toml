[package]
name = "rsdeseq2-formula"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "R formula evaluation and design matrices for rsdeseq2. Internal; use the rsdeseq2 crate."
documentation = "https://docs.rs/rsdeseq2"
exclude = [".DS_Store", "**/.DS_Store"]

[lints]
workspace = true

[features]
# Locale-aware (ICU) collation for factor levels and string comparisons.
icu = ["dep:icu_collator", "dep:icu_locale"]

[dependencies]
icu_collator = { workspace = true, optional = true }
icu_locale = { workspace = true, optional = true }
rsdeseq2-base.workspace = true
