name: Platform checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    name: Check ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: r-lib/actions/setup-r@v2
        if: matrix.name == 'windows-x86_64' || matrix.name == 'macos-x86_64'
        with:
          r-version: '4.6.2'
      - name: Generate independent platform uniform CDFs
        if: matrix.name == 'windows-x86_64' || matrix.name == 'macos-x86_64'
        shell: bash
        run: |
          Rscript --vanilla scripts/generate_uniform_cdf_reference.R uniform-cdf.tsv > uniform-cdf-provenance.txt
          echo "RSDESEQ2_UNIFORM_CDF_REFERENCE=${{ github.workspace }}/uniform-cdf.tsv" >> "$GITHUB_ENV"
      - name: Numerical checks on target and release profile
        run: python3 scripts/check_release_target.py --target ${{ matrix.target }}

      - name: Retain independent uniform CDF provenance
        if: always() && (matrix.name == 'windows-x86_64' || matrix.name == 'macos-x86_64')
        uses: actions/upload-artifact@v4
        with:
          name: uniform-cdf-${{ matrix.name }}-${{ github.sha }}
          path: |
            uniform-cdf.tsv
            uniform-cdf-provenance.txt
          if-no-files-found: error
