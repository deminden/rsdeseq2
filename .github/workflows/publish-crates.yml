name: Publish crate

on:
  workflow_call:
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

permissions:
  contents: read
  deployments: write

concurrency:
  group: publish-crate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish rsdeseq2 to crates.io
    runs-on: ubuntu-latest
    environment:
      name: crates.io
      url: https://crates.io/crates/rsdeseq2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-source-${{ github.sha }}
          path: validated
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Verify successful source validation
        run: python3 scripts/release/release_artifact_manifest.py verify validated

      - name: Check tag matches crate version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(
            cargo metadata --locked --no-deps --format-version 1 \
              | python3 -c 'import json, sys; data = json.load(sys.stdin); print(next(package["version"] for package in data["packages"] if package["name"] == "rsdeseq2"))'
          )"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match rsdeseq2 crate version $crate_version" >&2
            exit 1
          fi

      - name: Stage the checked crate source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release/stage_release_crate.py

      - name: Package
        run: cargo package -p rcompat-numeric -p rcompat-formula -p rcompat-shrinkage -p rsdeseq2 --locked --allow-dirty

      - name: Verify regenerated crate matches checked archive
        run: |
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          data = json.loads(Path('validated/validation.json').read_text())
          for name in (name for name in data['files'] if name.endswith('.crate')):
              actual = hashlib.sha256((Path('target/package')/name).read_bytes()).hexdigest()
              if actual != data['files'][name]:
                  raise SystemExit(f'Crate archive {name} differs from validated package')
          PYCODE

      - name: Publish
        if: ${{ github.ref != 'refs/tags/v0.2.6' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # The rcompat crates have their own versions; a version that is
        # already on crates.io (unchanged since the last release) is skipped.
        run: |
          for crate in rcompat-numeric rcompat-formula rcompat-shrinkage; do
            if ! output=$(cargo publish -p "$crate" --locked --allow-dirty 2>&1); then
              echo "$output"
              echo "$output" | grep -q "already exists" || exit 1
            fi
          done
          cargo publish -p rsdeseq2 --locked --allow-dirty
