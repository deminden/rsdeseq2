name: Publish crate

on:
  workflow_call:
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

permissions:
  contents: read
  deployments: write

concurrency:
  group: publish-crate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish rsdeseq2 to crates.io
    runs-on: ubuntu-latest
    environment:
      name: crates.io
      url: https://crates.io/crates/rsdeseq2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: validated-source-${{ github.sha }}
          path: validated
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify successful source validation
        run: python3 scripts/release/release_artifact_manifest.py verify validated

      - name: Check tag matches crate version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(
            cargo metadata --locked --no-deps --format-version 1 \
              | python3 -c 'import json, sys; data = json.load(sys.stdin); print(next(package["version"] for package in data["packages"] if package["name"] == "rsdeseq2"))'
          )"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match rsdeseq2 crate version $crate_version" >&2
            exit 1
          fi

      - name: Stage the checked crate source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release/stage_release_crate.py

      - name: Package
        run: cargo package -p rsdeseq2 --locked --allow-dirty

      - name: Verify regenerated crate matches checked archive
        run: |
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          data = json.loads(Path('validated/validation.json').read_text())
          name = next(name for name in data['files'] if name.endswith('.crate'))
          actual = hashlib.sha256((Path('target/package')/name).read_bytes()).hexdigest()
          if actual != data['files'][name]:
              raise SystemExit('Crate archive differs from validated package')
          PYCODE

      - name: Publish
        if: ${{ github.ref != 'refs/tags/v0.2.6' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p rsdeseq2 --locked --allow-dirty
