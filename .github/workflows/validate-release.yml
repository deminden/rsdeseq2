name: Validate release source

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    uses: ./.github/workflows/rust.yml
  r:
    uses: ./.github/workflows/r.yml
  parity:
    uses: ./.github/workflows/parity.yml
    with:
      full_only: true
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: '1.97.1'
      - run: cargo check --locked --workspace --all-targets
  artifacts:
    needs: [rust, r, parity, msrv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: r-source-${{ github.sha }}
          path: validated
      - name: Prepare checked crate source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release/stage_release_crate.py
          cargo package --workspace --locked --allow-dirty --no-verify
          python3 scripts/release/verify_release_crates.py
          cp target/package/{rcompat-numeric,rcompat-formula,rcompat-shrinkage,rsdeseq2}-*.crate validated/
          python3 scripts/release/release_artifact_manifest.py write validated
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-source-${{ github.sha }}
          path: validated/*
          if-no-files-found: error
