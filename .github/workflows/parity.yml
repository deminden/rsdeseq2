name: Parity

on:
  workflow_dispatch:
    inputs:
      full_only:
        type: boolean
        default: false
  workflow_call:
    inputs:
      full_only:
        type: boolean
        default: false

jobs:
  frozen-oracles:
    if: ${{ !inputs.full_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Native and fixed-dispersion DESeq2 numerical references
        run: >-
          cargo test --locked -p rsdeseq2 --test integration --
          gtex_real_wald_parity:: auto_dispersion::
          dispersion_reference:: wald_reference:: lrt_reference::
          results_reference:: glm_irls:: cooks_reference::
          thread_invariance::
      - name: Portable R optimizer oracles
        run: cargo test --locked -p rsdeseq2 --lib optim_fallback_replays_portable
      - name: Parity, fixture generation and benchmark integrity checks
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

  full-gtex-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: All 56,200 genes and all six Wald result columns
        run: cargo test --locked -p rsdeseq2 --test integration gtex_real_wald_parity::full_gtex_wald -- --ignored --nocapture
