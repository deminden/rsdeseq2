name: R

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  r:
    runs-on: ubuntu-26.04
    continue-on-error: ${{ matrix.lane != 'reference' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: reference
            r-version: '4.6.2'
          - lane: current
            r-version: release
          - lane: previous-bioc
            r-version: '4.5.3'
            bioc-version: '3.22'
    env:
      R_LIBS_USER: ${{ github.workspace }}/.r-library-${{ matrix.lane }}
      MAKEFLAGS: -j2
      OPENBLAS_NUM_THREADS: '1'
      OPENBLAS_CORETYPE: Haswell
      LC_ALL: C.UTF-8
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.r-version }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Check R vendor manifests and package versions
        run: scripts/release/sync_r_vendor.sh --check
      - name: Reject production R numerical calculations
        run: Rscript --vanilla scripts/validation/audit_r_numerical_boundary.R r-pkg/rsdeseq2/R
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev libcurl4-openssl-dev libxml2-dev libssl-dev libblas-dev liblapack-dev gfortran clang
      - run: mkdir -p "$R_LIBS_USER"
      - name: Cache exact reference packages
        id: reference-cache
        if: matrix.lane == 'reference'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-reference-ubuntu-26.04-${{ runner.arch }}-4.6.2-${{ hashFiles('config/r-reference/r-reference-sources-2026-10-29.tsv', 'config/r-reference/r-reference-environment-2026-10-29.json', 'scripts/environment/install_locked_r_packages.R', 'scripts/environment/install_r_reference.py') }}
      - name: Restore verified numerical reference environment
        if: matrix.lane == 'reference'
        run: python scripts/environment/install_r_reference.py --library "$R_LIBS_USER" ${{ steps.reference-cache.outputs.cache-hit == 'true' && '--check-installed' || '' }}
      - name: Cache verified reference dependencies
        if: matrix.lane == 'reference' && steps.reference-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-reference-ubuntu-26.04-${{ runner.arch }}-4.6.2-${{ hashFiles('config/r-reference/r-reference-sources-2026-10-29.tsv', 'config/r-reference/r-reference-environment-2026-10-29.json', 'scripts/environment/install_locked_r_packages.R', 'scripts/environment/install_r_reference.py') }}
      - name: Install compatibility dependencies
        if: matrix.lane != 'reference'
        env:
          BIOC_VERSION: ${{ matrix.bioc-version }}
        run: |
          Rscript --vanilla -e '
            options(repos = c(CRAN = "https://cloud.r-project.org"))
            install.packages(c("testthat", "ashr", "BiocManager"))
            version <- Sys.getenv("BIOC_VERSION")
            if (nzchar(version)) BiocManager::install(version = version, ask = FALSE, update = FALSE)
            BiocManager::install(c("DESeq2", "apeglm"), ask = FALSE, update = FALSE)
          '
      - name: Record environment
        run: |
          Rscript --vanilla -e 'print(sessionInfo()); print(packageVersion("DESeq2"))' | tee R-reference-session.txt
      - name: Save earlier Bioconductor comparison
        if: always() && matrix.lane == 'previous-bioc' && hashFiles('R-reference-session.txt') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r-previous-bioc-environment-${{ github.sha }}
          path: R-reference-session.txt
          if-no-files-found: error
      - name: Independently regenerate Linux formula references
        if: matrix.lane == 'reference'
        run: python scripts/validation/check_linux_formula_references.py --output-dir regenerated-formula-references
      - name: Independently generate sparse SQP references
        if: matrix.lane == 'reference'
        run: Rscript --vanilla scripts/references/generate_sparse_sqp_reference.R sparse-sqp-reference.json
      - name: Save independently generated platform references
        if: always() && matrix.lane == 'reference' && hashFiles('regenerated-formula-references/*.json', 'sparse-sqp-reference.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formula-sqp-reference-${{ github.sha }}
          path: |
            regenerated-formula-references/*.json
            sparse-sqp-reference.json
          if-no-files-found: error
      - name: Check fresh platform oracles without changing saved references
        if: matrix.lane == 'reference'
        env:
          RSDESEQ2_FORMULA_FITTING_REFERENCE: ${{ github.workspace }}/regenerated-formula-references/formula_fitting_r462.json
          RSDESEQ2_SPARSE_SQP_REFERENCE: ${{ github.workspace }}/sparse-sqp-reference.json
        run: >-
          cargo test --locked -p rsdeseq2 --test integration --
          formula_fitting:: sqp_controls::
      - name: Independently record uniform posterior references
        if: matrix.lane == 'reference'
        run: Rscript --vanilla scripts/references/generate_uniform_posterior_reference.R uniform-posterior-reference.json
      - name: Save independent posterior reference
        if: matrix.lane == 'reference'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uniform-reference-${{ github.sha }}
          path: uniform-posterior-reference.json
          if-no-files-found: error
      - name: Build package
        id: r-source
        run: |
          scripts/release/build_r_source.sh .
          Rscript --vanilla -e 'version <- read.dcf("r-pkg/rsdeseq2/DESCRIPTION")[1L, "Version"]; cat(paste0("archive=rsdeseq2_", version, ".tar.gz\n"), file=Sys.getenv("GITHUB_OUTPUT"), append=TRUE)'
      - name: Package check
        env:
          RSDESEQ2_R_SOURCE: ${{ steps.r-source.outputs.archive }}
        run: R CMD check --no-manual --no-build-vignettes "$RSDESEQ2_R_SOURCE"
      - name: Save earlier Bioconductor check results
        if: always() && matrix.lane == 'previous-bioc' && hashFiles('rsdeseq2.Rcheck/00check.log') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r-previous-bioc-check-${{ github.sha }}
          path: |
            rsdeseq2.Rcheck/00check.log
            rsdeseq2.Rcheck/tests/testthat.Rout*
          if-no-files-found: error
      - name: Fail on skipped or failing R tests
        if: matrix.lane == 'reference'
        run: Rscript --vanilla scripts/validation/check_no_skipped_r_tests.R rsdeseq2.Rcheck r-pkg/rsdeseq2/tests/testthat
      - name: Check actual posterior interruption and interpreter reuse
        if: matrix.lane == 'reference'
        run: python scripts/validation/check_posterior_interruption.py --rscript "$(command -v Rscript)" --r-library rsdeseq2.Rcheck
      - name: Instrument Linux native boundary and forced unwind cleanup
        if: matrix.lane == 'reference'
        run: python scripts/validation/check_native_boundary_sanitizers.py --rscript "$(command -v Rscript)" --r-library "$R_LIBS_USER" --output-dir native-boundary-sanitizers
      - name: Save native boundary instrumentation evidence
        if: always() && matrix.lane == 'reference'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-boundary-sanitizers-${{ github.sha }}
          path: |
            native-boundary-sanitizers/sanitizers.json
            native-boundary-sanitizers/*.log
          if-no-files-found: error
      - name: Require standalone and wrapped primitives to be bit-identical
        run: |
          cargo build --release --locked -p rsdeseq2 --example evaluate_r_interface
          Rscript --vanilla scripts/validation/check_rust_r_identity.R target/release/examples/evaluate_r_interface rsdeseq2.Rcheck cross-interface-primitives
          Rscript --vanilla scripts/validation/check_fresh_fit_identity.R target/release/examples/evaluate_r_interface rsdeseq2.Rcheck cross-interface-fresh-fits
          Rscript --vanilla scripts/validation/check_formula_fit_identity.R target/release/examples/evaluate_r_interface rsdeseq2.Rcheck cross-interface-formula-fits
          Rscript --vanilla scripts/validation/check_formula_expression_identity.R target/release/examples/evaluate_r_interface rsdeseq2.Rcheck cross-interface-expressions
          Rscript --vanilla scripts/validation/check_native_formula_identity.R target/release/examples/evaluate_r_interface rsdeseq2.Rcheck cross-interface-native-formulas
          Rscript --vanilla scripts/validation/check_native_factor_identity.R target/release/examples/evaluate_r_interface rsdeseq2.Rcheck cross-interface-native-factors
          Rscript --vanilla scripts/validation/check_frozen_local_identity.R target/release/examples/evaluate_r_interface rsdeseq2.Rcheck cross-interface-frozen-local
          Rscript --vanilla scripts/validation/check_posterior_identity.R target/release/examples/evaluate_r_interface rsdeseq2.Rcheck cross-interface-posterior
          Rscript --vanilla scripts/validation/check_location_shrinkage_identity.R target/release/examples/evaluate_r_interface rsdeseq2.Rcheck cross-interface-sparse-sqp crates/rsdeseq2/tests/data/sparse_sqp_r462.json
          Rscript --vanilla scripts/validation/check_native_ashr_optimizers.R target/release/examples/evaluate_r_interface rsdeseq2.Rcheck cross-interface-sparse-sqp-diagnostics - crates/rsdeseq2/tests/data/sparse_sqp_r462.json
          Rscript --vanilla scripts/validation/check_mixture_fit_identity.R target/release/examples/evaluate_r_interface rsdeseq2.Rcheck cross-interface-prior-fitting
          Rscript --vanilla scripts/validation/check_native_ashr_output.R target/release/examples/evaluate_r_interface rsdeseq2.Rcheck cross-interface-likelihood-warnings - crates/rsdeseq2/tests/data/likelihood_warnings_r462.json
          Rscript --vanilla scripts/validation/check_native_ashr_output.R target/release/examples/evaluate_r_interface rsdeseq2.Rcheck cross-interface-fixed-controls - crates/rsdeseq2/tests/data/fixed_prior_controls_r462.json
          Rscript --vanilla scripts/validation/check_native_ashr_mode.R target/release/examples/evaluate_r_interface rsdeseq2.Rcheck cross-interface-mode-warnings - crates/rsdeseq2/tests/data/likelihood_warnings_r462.json
          Rscript --vanilla scripts/validation/check_normal_log_identity.R target/release/examples/evaluate_r_interface rsdeseq2.Rcheck cross-interface-log-tails
          Rscript --vanilla scripts/validation/check_uniform_posterior_identity.R target/release/examples/evaluate_r_interface rsdeseq2.Rcheck cross-interface-uniform
          if [ "${{ matrix.lane }}" = reference ]; then
            Rscript --vanilla scripts/validation/check_uniform_posterior_identity.R target/release/examples/evaluate_r_interface rsdeseq2.Rcheck cross-interface-uniform-live uniform-posterior-reference.json
            Rscript --vanilla scripts/validation/check_location_shrinkage_identity.R target/release/examples/evaluate_r_interface rsdeseq2.Rcheck cross-interface-sparse-sqp-live sparse-sqp-reference.json
            Rscript --vanilla scripts/validation/check_native_ashr_optimizers.R target/release/examples/evaluate_r_interface rsdeseq2.Rcheck cross-interface-sparse-sqp-diagnostics-live - sparse-sqp-reference.json
          fi
      - name: Check strict workflow and original-ashr comparison gates
        if: matrix.lane == 'reference'
        env:
          RSDESEQ2_TEST_RSCRIPT: Rscript
          RSDESEQ2_TEST_RLIB: ${{ github.workspace }}/rsdeseq2.Rcheck
        run: python -m unittest discover -s scripts/tests -p test_profile_r_workflows.py
      - name: Save checked source package
        if: matrix.lane == 'reference'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r-source-${{ github.sha }}
          path: |
            ${{ steps.r-source.outputs.archive }}
            R-reference-session.txt
          if-no-files-found: error

  windows-native:
    needs: r
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.2'
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: '1.96.0'
          targets: x86_64-pc-windows-gnullvm
      - name: Prepare UCRT LLVM-MinGW
        shell: pwsh
        run: |
          $release = '20261117'
          $toolchain = "llvm-mingw-$release-ucrt-x86_64"
          $zip = Join-Path $env:RUNNER_TEMP "$toolchain.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$release/$toolchain.zip" -OutFile $zip
          $expected = '4d002e330a0f703625aa5ccbc37e96f8f824413e163bfc7336774aabd2c3a412'
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $expected) {
            throw 'LLVM-MinGW archive checksum mismatch'
          }
          $directory = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Expand-Archive -LiteralPath $zip -DestinationPath $directory
          $bin = Join-Path $directory "$toolchain/bin"
          if (!(Test-Path -LiteralPath (Join-Path $bin 'x86_64-w64-mingw32-clang.exe') -PathType Leaf)) {
            throw 'Missing x86_64 LLVM-MinGW driver'
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Download checked R source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: r-source-${{ github.sha }}
          path: ${{ runner.temp }}/checked-r-source
      - name: Install offline and exercise native routines
        shell: pwsh
        env:
          CARGO_NET_OFFLINE: 'true'
          RUSTUP_TOOLCHAIN: '1.96.0'
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'checked-r-source'
          $archive = Get-ChildItem -LiteralPath $source -File -Filter 'rsdeseq2_*.tar.gz'
          if (@($archive).Count -ne 1) { throw 'Expected one checked R source archive' }
          $library = Join-Path $env:RUNNER_TEMP 'rsdeseq2-r-library'
          [void](New-Item -ItemType Directory -Path $library)
          R.exe CMD INSTALL "--library=$library" $archive.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Rscript.exe --vanilla scripts/validation/check_r_native_install.R $library
