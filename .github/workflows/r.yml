name: R

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
      - uses: dtolnay/rust-toolchain@stable
      - name: Sync Rust core into the R source package
        run: scripts/sync_r_vendor.sh
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev
      - name: Install test dependencies
        run: Rscript -e 'options(repos = c(CRAN = "https://cloud.r-project.org")); if (!requireNamespace("testthat", quietly = TRUE)) install.packages("testthat"); if (!requireNamespace("ashr", quietly = TRUE)) install.packages("ashr"); if (!requireNamespace("BiocManager", quietly = TRUE)) install.packages("BiocManager"); needed <- c("DESeq2", "apeglm")[!vapply(c("DESeq2", "apeglm"), requireNamespace, logical(1), quietly = TRUE)]; if (length(needed)) BiocManager::install(needed, ask = FALSE, update = FALSE)'
      - name: Build package
        run: R CMD build r-pkg/rsdeseq2
      - name: Package check
        run: R CMD check --no-manual --no-build-vignettes rsdeseq2_*.tar.gz
