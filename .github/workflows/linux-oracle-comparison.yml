name: Linux R oracle comparison
on:
  push:
    branches: [codex/linux-oracle-comparison-7770534]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare Rust with independent Linux R references
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --workspace --no-fail-fast 2>&1 | tee oracle-comparison.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-oracle-comparison
          path: oracle-comparison.log
