name: Rust

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check R vendor manifests and package versions
        run: scripts/release/sync_r_vendor.sh --check
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Library feature combinations
        run: |
          for features in "" "formula" "shrinkage" "formula,shrinkage"; do
            cargo clippy --locked -p rsdeseq2 --lib --no-default-features --features "$features" -- \
              -D warnings
          done
      - name: API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p rcompat-numeric -p rcompat-formula -p rcompat-shrinkage -p rsdeseq2 --no-deps
      - name: Test
        run: cargo test --locked --workspace
      - name: Fuzz targets build (stable; fuzzing itself runs weekly on nightly)
        run: cargo check --locked --manifest-path fuzz/Cargo.toml
      - name: Golden output hashes
        run: cargo run --release --locked -p rsdeseq2 --example golden -- --check
      - name: Portable golden output hashes
        env:
          RSDESEQ2_NUMERIC_PROFILE: portable
        run: cargo run --release --locked -p rsdeseq2 --example golden -- --check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Documentation and release-document checks
        run: python scripts/validation/check_docs.py
      - name: Module dependency cycles
        run: python scripts/validation/check_module_cycles.py
      - name: Parity and benchmark integrity checks
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

  msrv:
    # The declared rust-version must build and pass the library tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build and test at the MSRV
        run: |
          cargo build --locked -p rcompat-numeric -p rcompat-formula -p rcompat-shrinkage -p rsdeseq2 --all-features
          cargo test --locked -p rcompat-numeric -p rcompat-formula -p rcompat-shrinkage -p rsdeseq2 --lib

  deny:
    # Licences, advisories, bans and sources (deny.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
        with:
          command: check
          arguments: --all-features

  semver:
    # Public API changes must match the version bump.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: rsdeseq2
