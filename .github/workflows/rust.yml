name: Rust

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check committed Rust vendor and package versions
        run: scripts/release/sync_r_vendor.sh --check
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        # missing_docs warns until the public API is documented (see the
        # report step); every other warning fails the build.
        run: >-
          cargo clippy --locked --workspace --all-targets -- -D warnings
          -A missing_docs
      - name: Library feature combinations
        run: |
          for features in "" "formula" "shrinkage" "formula,shrinkage"; do
            cargo clippy --locked -p rsdeseq2 --lib --no-default-features --features "$features" -- \
              -D warnings -A missing_docs
          done
      - name: Hardening lint report (not gating)
        continue-on-error: true
        run: |
          cargo clippy --locked --workspace --all-targets --message-format=short 2>&1 \
            | grep -E ': warning: ' | sort -u > hardening-lints.txt || true
          echo "missing_docs warnings: $(wc -l < hardening-lints.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: API documentation
        env:
          # missing_docs is a warn-level hardening target (Phase 2.4).
          RUSTDOCFLAGS: -D warnings -A missing_docs
        run: cargo doc --locked -p rsdeseq2 --no-deps
      - name: Test
        run: cargo test --workspace
      - name: Golden output hashes
        run: cargo run --release --locked -p rsdeseq2 --example golden -- --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Documentation and release-document checks
        run: python scripts/validation/check_docs.py
      - name: Parity and benchmark integrity checks
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
