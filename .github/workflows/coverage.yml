name: coverage and mutation

# Weekly and on demand: line coverage for the core crate, and cargo-mutants on
# the modules whose arithmetic every result depends on. Neither gates pull
# requests; surviving mutants are reviewed and either killed with a test or
# recorded as equivalent in docs/reports/hardening-progress.md.

on:
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-llvm-cov
      - name: Line coverage (lib and integration tests)
        run: |
          cargo llvm-cov --locked --no-report -p rcompat-collate -p rcompat-numeric -p rcompat-formula -p rcompat-shrinkage --lib
          cargo llvm-cov --locked --no-report -p rsdeseq2 --lib --test integration
          cargo llvm-cov report --summary-only | tee coverage-summary.txt
          cargo llvm-cov report --lcov --output-path lcov.info
          tail -n 1 coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage-summary.txt
            lcov.info

  mutants:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: rcompat-numeric, files: 'crates/rcompat-numeric/src/numeric/*.rs', tests: '--cargo-test-arg=--lib' }
          - { crate: rsdeseq2, files: crates/rsdeseq2/src/multiple_testing.rs, tests: '--cargo-test-arg=--lib --cargo-test-arg=--test --cargo-test-arg=integration' }
          - { crate: rsdeseq2, files: crates/rsdeseq2/src/normalization.rs, tests: '--cargo-test-arg=--lib --cargo-test-arg=--test --cargo-test-arg=integration' }
          - { crate: rsdeseq2, files: crates/rsdeseq2/src/filtering.rs, tests: '--cargo-test-arg=--lib --cargo-test-arg=--test --cargo-test-arg=integration' }
          - { crate: rsdeseq2, files: 'crates/rsdeseq2/src/glm/irls/*.rs', tests: '--cargo-test-arg=--lib --cargo-test-arg=--test --cargo-test-arg=integration' }
          - { crate: rsdeseq2, files: crates/rsdeseq2/src/dispersion/map.rs, tests: '--cargo-test-arg=--lib --cargo-test-arg=--test --cargo-test-arg=integration' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-mutants
      - name: Mutants in ${{ matrix.files }}
        shell: bash
        env:
          MUTATION_CRATE: ${{ matrix.crate }}
          MUTATION_FILES: ${{ matrix.files }}
        run: |
          selection=(-p "$MUTATION_CRATE" -f "$MUTATION_FILES" --cargo-arg=--locked)
          cargo mutants "${selection[@]}" --list --json | jq -e 'length > 0' > /dev/null

          mutation_exit=0
          cargo mutants "${selection[@]}" -o . --timeout 600 ${{ matrix.tests }} || mutation_exit=$?
          # Missed mutants and mutant timeouts remain diagnostic results.
          case "$mutation_exit" in
            0|2|3) ;;
            *) exit "$mutation_exit" ;;
          esac
      - name: Summary
        if: always() && hashFiles('mutants.out/outcomes.json') != ''
        run: |
          for kind in caught missed timeout unviable; do
            echo "$kind: $(wc -l < mutants.out/$kind.txt)" >> "$GITHUB_STEP_SUMMARY"
          done
          sed 's/^/- /' mutants.out/missed.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('mutants.out/**') != ''
        with:
          name: mutants-${{ strategy.job-index }}-${{ github.sha }}
          path: mutants.out


  miri:
    runs-on: ubuntu-latest
    env:
      RSDESEQ2_NUMERIC_PROFILE: portable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: nightly
          components: miri
      - name: Check matrix views and checked arithmetic under Miri
        run: >-
          cargo miri test --locked -p rcompat-numeric --lib --
          matrix::tests:: numeric::checked::tests:: numeric::validate::tests::

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-audit
      - name: Check locked dependencies against RustSec
        run: cargo audit --file Cargo.lock
